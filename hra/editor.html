<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Editor mapy – Mikulášská obchůzka Lidečko</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1d21;color:#eee;font:14px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
#panel{position:fixed;left:0;top:0;bottom:0;width:min(340px,92vw);background:rgba(24,26,30,.94);border-right:1px solid #3a3d44;display:flex;flex-direction:column;z-index:5}
#panel.min{transform:translateX(-100%)}
#panel header{padding:12px 14px 8px;border-bottom:1px solid #33363c}
#panel h1{font:400 20px/1.2 Georgia,"Times New Roman",serif;margin:0 0 8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{background:#2a2d33;border:1px solid #3a3d44;border-radius:6px;padding:7px 0;font-size:13px}
.tabs button[aria-pressed=true]{background:#e9e9e9;color:#111;border-color:#e9e9e9}
#body{flex:1;overflow:auto;padding:12px 14px 30px;touch-action:pan-y}
.sec{border-top:1px solid #33363c;padding-top:10px;margin-top:12px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#9aa0aa;margin:0 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:1;color:#c9ccd2}
.row input[type=number]{width:80px;background:#111317;border:1px solid #444851;border-radius:5px;padding:5px 6px}
.row input[type=text],.row select{background:#111317;border:1px solid #444851;border-radius:5px;padding:5px 6px;min-width:0}
.row input[type=text]{flex:1}
.row input[type=range]{width:130px}
.row input[type=color]{width:44px;height:30px;border:1px solid #444851;border-radius:5px;background:#111317;padding:1px}
.btn{background:#2a2d33;border:1px solid #4a4e57;border-radius:6px;padding:7px 10px;font-size:13px}
.btn:hover{background:#353941}
.btn.pri{background:#e9e9e9;color:#111;border-color:#e9e9e9}
.btn.warn{border-color:#8a3a3a;color:#f3b0b0}
.btn.sm{padding:3px 7px;font-size:12px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pal{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.pal button{background:#2a2d33;border:1px solid #3a3d44;border-radius:6px;padding:8px 6px;text-align:left;font-size:13px}
.pal button[aria-pressed=true]{background:#e9e9e9;color:#111}
.note{color:#9aa0aa;font-size:12.5px;margin:6px 0}
.list button{display:block;width:100%;text-align:left;background:#22252a;border:1px solid #3a3d44;border-radius:6px;padding:7px 9px;margin:4px 0}
.info{background:#22252a;border-radius:6px;padding:8px 10px;margin:6px 0;font-size:13px}
#top{position:fixed;right:10px;top:10px;display:flex;gap:6px;z-index:6}
#top .btn{background:rgba(24,26,30,.9)}
#toggle{position:fixed;left:min(340px,92vw);top:10px;z-index:6;margin-left:8px}
#panel.min+#toggle{left:0}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:8px 14px;border-radius:8px;font-size:14px;max-width:80vw;text-align:center;z-index:6}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:10px 16px;border-radius:10px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:9}
#toast.on{opacity:1}
#status{font-size:12px;color:#9aa0aa;padding:6px 14px;border-top:1px solid #33363c}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#1b1d21;font-size:16px;z-index:20}
#zdroj{position:fixed;right:6px;bottom:2px;font-size:10px;color:rgba(255,255,255,.55);pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
 <header>
  <h1>Editor mapy</h1>
  <div class="tabs" id="tabs">
   <button type="button" data-t="dum" aria-pressed="true">Dům</button>
   <button type="button" data-t="cesty" aria-pressed="false">Cesty</button>
   <button type="button" data-t="obj" aria-pressed="false">Objekty</button>
   <button type="button" data-t="soubor" aria-pressed="false">Soubor</button>
  </div>
 </header>
 <div id="body"></div>
 <div id="status">Úpravy se ukládají v tomto prohlížeči.</div>
</div>
<button class="btn" id="toggle" type="button">☰</button>
<div id="top">
 <button class="btn" id="bUndo" type="button" title="Ctrl+Z">↶ Zpět</button>
 <button class="btn" id="bDay" type="button">Noc</button>
 <a class="btn" href="index.html" style="text-decoration:none;color:#eee">Hrát ▶</a>
</div>
<div id="hint" class="hide"></div>
<div id="toast"></div>
<div id="loading">Načítám Lidečko…</div>
<div id="zdroj">Mapa © přispěvatelé OpenStreetMap · Terén, adresy, budovy a stromy © ČÚZK (CC BY 4.0)</div>
<script src="three.min.js"></script>
<script src="polnak.js"></script>
<script src="upravy.js"></script>
<script src="svet.js"></script>
<script src="editor.js"></script>
</body>
</html>
